# P5-STUB: remove this line when the first real job lands
name: p5-med

on:
  workflow_call:
    # Interface only: ci.yml passes these names (med plan section 3d). No stub step reads them.
    secrets:
      MEDUSA_ADMIN_EMAIL:
        required: false
      MEDUSA_ADMIN_PASSWORD:
        required: false
      STRIPE_API_KEY:
        required: false
      STRIPE_WEBHOOK_SECRET:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record stub status
        id: status
        run: |
          echo "status=not-implemented" >> "$GITHUB_OUTPUT"
          {
            echo "### P5 med lane"
            echo "NOT IMPLEMENTED: no tests or scanners in this lane yet."
          } >> "$GITHUB_STEP_SUMMARY"

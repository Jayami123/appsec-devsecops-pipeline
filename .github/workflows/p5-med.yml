name: p5-med

on:
  workflow_call:
    # Named secrets only (least privilege, med plan 3d). Only the start, seed and test steps read MEDUSA_ADMIN_*.
    secrets:
      MEDUSA_ADMIN_EMAIL:
        required: false
      MEDUSA_ADMIN_PASSWORD:
        required: false
      STRIPE_API_KEY:
        required: false
      STRIPE_WEBHOOK_SECRET:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  med-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN med (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Bootstrap medusa
        run: bash scripts/bootstrap.sh medusa
      - name: Start medusa
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$MEDUSA_ADMIN_EMAIL" ] || [ -z "$MEDUSA_ADMIN_PASSWORD" ]; then
            echo "BLOCKED: repository secrets MEDUSA_ADMIN_EMAIL and MEDUSA_ADMIN_PASSWORD are not set" >&2
            exit 1
          fi
          node node_modules/qa-portfolio-harness/scripts/up.mjs medusa
      - name: Seed medusa through the harness (output kept out of the log)
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs medusa > "$RUNNER_TEMP/smoke-medusa.log" 2>&1
      - name: Run the med project
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: npx playwright test --project=med --grep-invert "P5-MED-RBAC-001" --trace off
      - name: Stop medusa
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs medusa

  med-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN med (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Install the hashed Schemathesis lock
        run: |
          python3 -m venv "$RUNNER_TEMP/st-venv"
          "$RUNNER_TEMP/st-venv/bin/pip" install --require-hashes -r requirements/schemathesis.txt
          echo "SCHEMATHESIS_BIN=$RUNNER_TEMP/st-venv/bin/schemathesis" >> "$GITHUB_ENV"
      - name: Bootstrap medusa
        run: bash scripts/bootstrap.sh medusa
      - name: Start medusa
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$MEDUSA_ADMIN_EMAIL" ] || [ -z "$MEDUSA_ADMIN_PASSWORD" ]; then
            echo "BLOCKED: repository secrets MEDUSA_ADMIN_EMAIL and MEDUSA_ADMIN_PASSWORD are not set" >&2
            exit 1
          fi
          node node_modules/qa-portfolio-harness/scripts/up.mjs medusa
      - name: Seed medusa through the harness (output kept out of the log)
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs medusa > "$RUNNER_TEMP/smoke-medusa.log" 2>&1
      - name: Run the med-serial project
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: npx playwright test --project=med-serial --no-deps --trace off
      - name: Stop medusa
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs medusa

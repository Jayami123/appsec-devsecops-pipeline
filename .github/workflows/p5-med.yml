name: p5-med

on:
  workflow_call:
    # Named secrets only (least privilege, med plan 3d). Only the start, seed and test steps read MEDUSA_ADMIN_*.
    secrets:
      MEDUSA_ADMIN_EMAIL:
        required: false
      MEDUSA_ADMIN_PASSWORD:
        required: false
      STRIPE_API_KEY:
        required: false
      STRIPE_WEBHOOK_SECRET:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  med-api:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN med (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      # Put pnpm on PATH for the harness. Same approach as Jayami123/api-webhook-db-test-suite
      # .github/workflows/p2-med.yml:99-101 (npm install -g pnpm@<version>), pinned to the DTC starter
      # packageManager pnpm@10.11.1 (medusa-dtc-starter package.json:4; bootstrap.sh MEDUSA_PNPM).
      - name: Put pnpm on PATH for the harness (pinned to the bootstrap version)
        timeout-minutes: 5
        run: npm install -g pnpm@10.11.1 && pnpm --version
      - name: Bootstrap medusa
        run: bash scripts/bootstrap.sh medusa
      - name: Start medusa
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$MEDUSA_ADMIN_EMAIL" ] || [ -z "$MEDUSA_ADMIN_PASSWORD" ]; then
            echo "BLOCKED: repository secrets MEDUSA_ADMIN_EMAIL and MEDUSA_ADMIN_PASSWORD are not set" >&2
            exit 1
          fi
          node node_modules/qa-portfolio-harness/scripts/up.mjs medusa
      - name: Seed medusa through the harness (output kept out of the log)
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs medusa > "$RUNNER_TEMP/smoke-medusa.log" 2>&1
      - name: Run the med project
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-med-api.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=med --grep-invert "P5-MED-RBAC-001" --trace off --reporter=list,json,html
      - name: Sanitise the med-api report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts med-api "$RUNNER_TEMP/playwright-med-api.raw.json" results/playwright-med-api.json
      - name: Write the med-api job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts med-api results/playwright-med-api.json
      - name: Upload the med-api reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-med-api-report
          path: |
            playwright-report/
            results/playwright-med-api.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop medusa
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs medusa

  med-serial:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN med (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Install the hashed Schemathesis lock
        run: |
          python3 -m venv "$RUNNER_TEMP/st-venv"
          "$RUNNER_TEMP/st-venv/bin/pip" install --require-hashes -r requirements/schemathesis.txt
          echo "SCHEMATHESIS_BIN=$RUNNER_TEMP/st-venv/bin/schemathesis" >> "$GITHUB_ENV"
      # Put pnpm on PATH for the harness. Same approach as Jayami123/api-webhook-db-test-suite
      # .github/workflows/p2-med.yml:99-101 (npm install -g pnpm@<version>), pinned to the DTC starter
      # packageManager pnpm@10.11.1 (medusa-dtc-starter package.json:4; bootstrap.sh MEDUSA_PNPM).
      - name: Put pnpm on PATH for the harness (pinned to the bootstrap version)
        timeout-minutes: 5
        run: npm install -g pnpm@10.11.1 && pnpm --version
      - name: Bootstrap medusa
        run: bash scripts/bootstrap.sh medusa
      - name: Start medusa
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$MEDUSA_ADMIN_EMAIL" ] || [ -z "$MEDUSA_ADMIN_PASSWORD" ]; then
            echo "BLOCKED: repository secrets MEDUSA_ADMIN_EMAIL and MEDUSA_ADMIN_PASSWORD are not set" >&2
            exit 1
          fi
          node node_modules/qa-portfolio-harness/scripts/up.mjs medusa
      - name: Seed medusa through the harness (output kept out of the log)
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs medusa > "$RUNNER_TEMP/smoke-medusa.log" 2>&1
      - name: Run the med-serial project
        env:
          MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-med-serial.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=med-serial --no-deps --trace off --reporter=list,json,html
      - name: Sanitise the med-serial report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts med-serial "$RUNNER_TEMP/playwright-med-serial.raw.json" results/playwright-med-serial.json
      - name: Write the med-serial job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts med-serial results/playwright-med-serial.json
      - name: Upload the med-serial reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-med-serial-report
          path: |
            playwright-report/
            results/playwright-med-serial.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop medusa
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs medusa

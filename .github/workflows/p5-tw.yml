name: p5-tw

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tw-api:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the tw project
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-tw-api.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=tw --grep-invert "@multiws|@ssrf" --trace off --reporter=list,json,html
      - name: Sanitise the tw-api report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts tw-api "$RUNNER_TEMP/playwright-tw-api.raw.json" results/playwright-tw-api.json
      - name: Write the tw-api job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts tw-api results/playwright-tw-api.json
      - name: Upload the tw-api reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-tw-api-report
          path: |
            playwright-report/
            results/playwright-tw-api.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

  tw-multiws:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    # The README recipe of the harness (Twenty multi-workspace recipe). Single-server stack only: the replicas overlay
    # keeps server-2 single-workspace, so this job never sets TWENTY_SERVER_REPLICAS (D-TW-B46).
    env:
      TWENTY_BASE_URL: "http://lvh.me:3002"
      IS_MULTIWORKSPACE_ENABLED: "true"
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty (multi-workspace recipe)
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the @multiws rows of the tw project
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-tw-multiws.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=tw --grep "@multiws" --trace off --reporter=list,json,html
      - name: Sanitise the tw-multiws report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts tw-multiws "$RUNNER_TEMP/playwright-tw-multiws.raw.json" results/playwright-tw-multiws.json
      - name: Write the tw-multiws job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts tw-multiws results/playwright-tw-multiws.json
      - name: Upload the tw-multiws reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-tw-multiws-report
          path: |
            playwright-report/
            results/playwright-tw-multiws.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

  tw-serial:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Install the hashed Schemathesis lock into a venv
        run: |
          python3 -m venv "$RUNNER_TEMP/schemathesis"
          "$RUNNER_TEMP/schemathesis/bin/pip" install --quiet --require-hashes -r requirements/schemathesis.txt
          echo "P5_SCHEMATHESIS_BIN=$RUNNER_TEMP/schemathesis/bin/schemathesis" >> "$GITHUB_ENV"
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the tw-serial project
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-tw-serial.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=tw-serial --no-deps --trace off --reporter=list,json,html
      - name: Sanitise the tw-serial report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts tw-serial "$RUNNER_TEMP/playwright-tw-serial.raw.json" results/playwright-tw-serial.json
      - name: Write the tw-serial job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts tw-serial results/playwright-tw-serial.json
      - name: Upload the tw-serial reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-tw-serial-report
          path: |
            playwright-report/
            results/playwright-tw-serial.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

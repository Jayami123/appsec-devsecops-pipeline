name: p5-tw

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tw-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the tw project
        run: npx playwright test --project=tw --grep-invert "@multiws|@ssrf" --trace off
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

  tw-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Install the hashed Schemathesis lock into a venv
        run: |
          python3 -m venv "$RUNNER_TEMP/schemathesis"
          "$RUNNER_TEMP/schemathesis/bin/pip" install --quiet --require-hashes -r requirements/schemathesis.txt
          echo "P5_SCHEMATHESIS_BIN=$RUNNER_TEMP/schemathesis/bin/schemathesis" >> "$GITHUB_ENV"
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the tw-serial project
        run: npx playwright test --project=tw-serial --no-deps --trace off
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

  tw-ssrf-allow:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty
        env:
          OUTBOUND_HTTP_ALLOWED_INTERNAL_HOSTS: host.docker.internal # passthrough (twenty-passthrough.ts:11)
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the tw project
        run: npx playwright test --project=tw --grep "@ssrf-allow" --trace off
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

  tw-ssrf-default:
    runs-on: ubuntu-latest
    needs: [tw-ssrf-allow]
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN tw (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Bootstrap twenty
        run: bash scripts/bootstrap.sh twenty
      - name: Start twenty
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
      - name: Seed twenty through the harness (output kept out of the log)
        run: node node_modules/qa-portfolio-harness/scripts/smoke.mjs twenty > "$RUNNER_TEMP/smoke-twenty.log" 2>&1
      - name: Run the tw project
        run: npx playwright test --project=tw --grep "@ssrf-default" --trace off
      - name: Stop twenty
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

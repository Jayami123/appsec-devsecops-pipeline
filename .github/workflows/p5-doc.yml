name: p5-doc

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Documenso lane (doc plan section 5). Each job runs on a fresh runner with its own Documenso stack, started
# and stopped through the harness only. No secrets: the rows mint throwaway accounts and tokens through
# product routes (D-DOC-B6). The Node 24.22.0 runtime for Documenso is pinned per job (D-DOC-B9).
jobs:
  doc-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # LANE_JOB_TIMEOUT_MIN doc (src/security/budgets.ts), provisional
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Set up Node.js 24.22.0 for Documenso
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Pin the Node 24 path and record its npm
        run: |
          echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
          echo "node24 $(node --version) npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js from .nvmrc again for the harness scripts and Playwright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Bootstrap documenso
        run: bash scripts/bootstrap.sh documenso
      - name: Start documenso
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs documenso
      - name: Run the doc project
        run: npx playwright test --project=doc --trace off
      - name: Stop documenso
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs documenso

  doc-serial:
    needs: [doc-api]
    # !cancelled(): the serial rows still report when an api row is red (D-DOC-B16). The stacks are independent.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60 # LANE_JOB_TIMEOUT_MIN doc (src/security/budgets.ts), provisional
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Set up Node.js 24.22.0 for Documenso
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Pin the Node 24 path and record its npm
        run: |
          echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
          echo "node24 $(node --version) npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js from .nvmrc again for the harness scripts and Playwright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Bootstrap documenso
        run: bash scripts/bootstrap.sh documenso
      - name: Install the hashed Schemathesis lock
        run: |
          python3 -m venv "$RUNNER_TEMP/st-venv"
          "$RUNNER_TEMP/st-venv/bin/pip" install --require-hashes -r requirements/schemathesis.txt
          echo "SCHEMATHESIS_BIN=$RUNNER_TEMP/st-venv/bin/schemathesis" >> "$GITHUB_ENV"
      - name: Start documenso
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs documenso
      - name: Run the doc-serial project
        run: npx playwright test --project=doc-serial --no-deps --trace off
      - name: Stop documenso
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs documenso

name: p5-doc

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Documenso lane (doc plan section 5). Each job runs on a fresh runner with its own Documenso stack, started
# and stopped through the harness only. No secrets: the rows mint throwaway accounts and tokens through
# product routes (D-DOC-B6). The Node 24.22.0 runtime for Documenso is pinned per job (D-DOC-B9).
jobs:
  doc-api:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    # Same pin as Jayami123/api-webhook-db-test-suite .github/workflows/p2-doc.yml:47 and :152 at 99a2fde.
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # LANE_JOB_TIMEOUT_MIN doc (src/security/budgets.ts), provisional
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Set up Node.js 24.22.0 for Documenso
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Pin the Node 24 path and record its npm
        run: |
          echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
          echo "node24 $(node --version) npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js from .nvmrc again for the harness scripts and Playwright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Bootstrap documenso
        # The product install must not download browsers (P2 sets the same variable: p2-doc.yml:35-36 at 99a2fde).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: bash scripts/bootstrap.sh documenso
      - name: Start documenso
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs documenso
      - name: Run the doc project
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-doc-api.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=doc --trace off --reporter=list,json,html
      - name: Sanitise the doc-api report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts doc-api "$RUNNER_TEMP/playwright-doc-api.raw.json" results/playwright-doc-api.json
      - name: Write the doc-api job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts doc-api results/playwright-doc-api.json
      - name: Upload the doc-api reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-doc-api-report
          path: |
            playwright-report/
            results/playwright-doc-api.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Documenso web log, error lines only (masked; failure evidence)
        if: failure()
        run: |
          grep -iE "error|uncaught|exception|fatal|signal|killed|exit" node_modules/qa-portfolio-harness/.harness/documenso-web.log | tail -n 80 | cut -c1-300 | sed -E "s/(sessionId|csrfToken|cookie|authorization|token|password|secret)[=: ][^ ]*/\\1=***/Ig" || true
      - name: Stop documenso
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs documenso

  doc-serial:
    needs: [doc-api]
    # !cancelled(): the serial rows still report when an api row is red (D-DOC-B16). The stacks are independent.
    if: ${{ !cancelled() }}
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    # Same pin as Jayami123/api-webhook-db-test-suite .github/workflows/p2-doc.yml:47 and :152 at 99a2fde.
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # LANE_JOB_TIMEOUT_MIN doc (src/security/budgets.ts), provisional
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root and the run id for the whole job
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Set up Node.js 24.22.0 for Documenso
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Pin the Node 24 path and record its npm
        run: |
          echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
          echo "node24 $(node --version) npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js from .nvmrc again for the harness scripts and Playwright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Bootstrap documenso
        # The product install must not download browsers (P2 sets the same variable: p2-doc.yml:35-36 at 99a2fde).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: bash scripts/bootstrap.sh documenso
      - name: Install the hashed Schemathesis lock
        run: |
          python3 -m venv "$RUNNER_TEMP/st-venv"
          "$RUNNER_TEMP/st-venv/bin/pip" install --require-hashes -r requirements/schemathesis.txt
          echo "SCHEMATHESIS_BIN=$RUNNER_TEMP/st-venv/bin/schemathesis" >> "$GITHUB_ENV"
      - name: Start documenso
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs documenso
      - name: Run the doc-serial project
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-doc-serial.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=doc-serial --no-deps --trace off --reporter=list,json,html
      - name: Sanitise the doc-serial report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts doc-serial "$RUNNER_TEMP/playwright-doc-serial.raw.json" results/playwright-doc-serial.json
      - name: Write the doc-serial job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts doc-serial results/playwright-doc-serial.json
      - name: Upload the doc-serial reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-doc-serial-report
          path: |
            playwright-report/
            results/playwright-doc-serial.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Documenso web log, error lines only (masked; failure evidence)
        if: failure()
        run: |
          grep -iE "error|uncaught|exception|fatal|signal|killed|exit" node_modules/qa-portfolio-harness/.harness/documenso-web.log | tail -n 80 | cut -c1-300 | sed -E "s/(sessionId|csrfToken|cookie|authorization|token|password|secret)[=: ][^ ]*/\\1=***/Ig" || true
      - name: Stop documenso
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs documenso

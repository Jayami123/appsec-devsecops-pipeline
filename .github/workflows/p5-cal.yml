name: p5-cal

on:
  workflow_call:
    # Owner-approved exception to D-CAL-B8 (D-CAL-B58): one named secret, read only by the three steps below.
    secrets:
      STRIPE_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

# No job-level or workflow-level secret env. STRIPE_API_KEY is set only in the step env of the gate
# ("Require the Stripe test key"), the harness start ("Start cal") and the lane test step, copied from
# Jayami123/api-webhook-db-test-suite .github/workflows/p2-cal.yml (ref 99a2fdebbb60aac196fcb0fce16911e36a0d5c0a,
# lines 18-22 and 47-94). The gate runs before the harness starts. Forks never reach this workflow
# (ci.yml:59 is the same-repo guard).

jobs:
  cal-api:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN cal (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root, run id and per-job Cal keys
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
          for name in CRON_API_KEY CRON_SECRET; do
            value="$(openssl rand -hex 24)"; echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          value="$(openssl rand -base64 32)"; echo "::add-mask::$value"; echo "DAILY_WEBHOOK_SECRET=$value" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Require the Stripe test key (never printed)
        timeout-minutes: 2
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_API_KEY:-}" ]; then
            echo "::error::STRIPE_API_KEY is not set. Add the test-mode key as a repository secret; the cal lane stops here by design."
            exit 1
          fi
          # Test mode only: a live key must never reach the lane. The value is matched, never printed.
          case "$STRIPE_API_KEY" in
            sk_test_*) ;;
            *)
              echo "::error::STRIPE_API_KEY must be a Stripe test-mode secret key (it starts with sk_test_). The cal lane was not started."
              exit 1
              ;;
          esac
          echo "STRIPE_API_KEY is a test-mode key (value not printed)."
      - name: Bootstrap cal
        run: bash scripts/bootstrap.sh cal
      - name: Start cal
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs cal
      - name: Run the cal project
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-cal-api.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=cal --trace off --reporter=list,json,html
      - name: Sanitise the cal-api report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts cal-api "$RUNNER_TEMP/playwright-cal-api.raw.json" results/playwright-cal-api.json
      - name: Write the cal-api job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts cal-api results/playwright-cal-api.json
      - name: Upload the cal-api reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-cal-api-report
          path: |
            playwright-report/
            results/playwright-cal-api.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop cal
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs cal

  cal-ui:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN cal (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root, run id and per-job Cal keys
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
          for name in CRON_API_KEY CRON_SECRET; do
            value="$(openssl rand -hex 24)"; echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          value="$(openssl rand -base64 32)"; echo "::add-mask::$value"; echo "DAILY_WEBHOOK_SECRET=$value" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Require the Stripe test key (never printed)
        timeout-minutes: 2
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_API_KEY:-}" ]; then
            echo "::error::STRIPE_API_KEY is not set. Add the test-mode key as a repository secret; the cal lane stops here by design."
            exit 1
          fi
          # Test mode only: a live key must never reach the lane. The value is matched, never printed.
          case "$STRIPE_API_KEY" in
            sk_test_*) ;;
            *)
              echo "::error::STRIPE_API_KEY must be a Stripe test-mode secret key (it starts with sk_test_). The cal lane was not started."
              exit 1
              ;;
          esac
          echo "STRIPE_API_KEY is a test-mode key (value not printed)."
      - name: Bootstrap cal
        run: bash scripts/bootstrap.sh cal
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start cal
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs cal
      - name: Run the cal-ui project
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-cal-ui.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=cal-ui --trace off --reporter=list,json,html
      - name: Sanitise the cal-ui report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts cal-ui "$RUNNER_TEMP/playwright-cal-ui.raw.json" results/playwright-cal-ui.json
      - name: Write the cal-ui job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts cal-ui results/playwright-cal-ui.json
      - name: Upload the cal-ui reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-cal-ui-report
          path: |
            playwright-report/
            results/playwright-cal-ui.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop cal
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs cal

  cal-serial:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # LANE_JOB_TIMEOUT_MIN cal (src/security/budgets.ts:112)
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set the products root, run id and per-job Cal keys
        run: |
          echo "PRODUCTS_ROOT=$RUNNER_TEMP/products" >> "$GITHUB_ENV"
          echo "P5_RUN_ID=p5-qa-$(date -u +%Y%m%dt%H%M%Sz)-$(openssl rand -hex 4)" >> "$GITHUB_ENV"
          for name in CRON_API_KEY CRON_SECRET; do
            value="$(openssl rand -hex 24)"; echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          value="$(openssl rand -base64 32)"; echo "::add-mask::$value"; echo "DAILY_WEBHOOK_SECRET=$value" >> "$GITHUB_ENV"
      - name: Record the Docker server version
        run: echo "docker server $(docker info --format '{{.ServerVersion}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci
      - name: Require the Stripe test key (never printed)
        timeout-minutes: 2
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_API_KEY:-}" ]; then
            echo "::error::STRIPE_API_KEY is not set. Add the test-mode key as a repository secret; the cal lane stops here by design."
            exit 1
          fi
          # Test mode only: a live key must never reach the lane. The value is matched, never printed.
          case "$STRIPE_API_KEY" in
            sk_test_*) ;;
            *)
              echo "::error::STRIPE_API_KEY must be a Stripe test-mode secret key (it starts with sk_test_). The cal lane was not started."
              exit 1
              ;;
          esac
          echo "STRIPE_API_KEY is a test-mode key (value not printed)."
      - name: Bootstrap cal
        run: bash scripts/bootstrap.sh cal
      - name: Install the hashed Schemathesis lock
        run: |
          python3 -m venv "$RUNNER_TEMP/st-venv"
          "$RUNNER_TEMP/st-venv/bin/pip" install --require-hashes -r requirements/schemathesis.txt
          echo "SCHEMATHESIS_BIN=$RUNNER_TEMP/st-venv/bin/schemathesis" >> "$GITHUB_ENV"
      - name: Start cal
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          # The effective API v2 key limit (RL-002 reads it; the fork default is 120). Set before up (harness).
          RATE_LIMIT_DEFAULT_LIMIT_API_KEY: "120"
        run: node node_modules/qa-portfolio-harness/scripts/up.mjs cal
      - name: Run the cal-serial project
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          RATE_LIMIT_DEFAULT_LIMIT_API_KEY: "120"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-cal-serial.raw.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=cal-serial --no-deps --trace off --reporter=list,json,html
      - name: Sanitise the cal-serial report (private-first items reduced to ID and status)
        if: always()
        run: node scripts/prepare-ci-artifacts.ts cal-serial "$RUNNER_TEMP/playwright-cal-serial.raw.json" results/playwright-cal-serial.json
      - name: Write the cal-serial job summary (one row per title)
        if: always()
        run: node scripts/write-ci-job-summary.ts cal-serial results/playwright-cal-serial.json
      - name: Upload the cal-serial reports and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p5-cal-serial-report
          path: |
            playwright-report/
            results/playwright-cal-serial.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop cal
        if: always()
        run: node node_modules/qa-portfolio-harness/scripts/down.mjs cal

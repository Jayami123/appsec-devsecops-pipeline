# P5-STUB: remove this line when the first real job lands
name: p5-x

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record stub status
        id: status
        run: |
          echo "status=not-implemented" >> "$GITHUB_OUTPUT"
          {
            echo "### P5 closeout X"
            echo "NOT IMPLEMENTED: no tests or scanners in this lane yet."
          } >> "$GITHUB_STEP_SUMMARY"

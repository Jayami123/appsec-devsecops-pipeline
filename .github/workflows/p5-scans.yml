# P5-STUB: remove this line when the first real job lands
name: p5-scans

on:
  workflow_call:
    outputs:
      codeql_verdict:
        description: "CodeQL verdict. The stub reports not-implemented; it never reports pass."
        value: ${{ jobs.stub.outputs.codeql_verdict }}
      scanner_status:
        description: "name=verdict pairs for every scanner in config/scan/implementation-status.json"
        value: ${{ jobs.stub.outputs.scanner_status }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql_verdict: ${{ steps.status.outputs.codeql_verdict }}
      scanner_status: ${{ steps.status.outputs.scanner_status }}
    steps:
      - name: Record stub status
        id: status
        run: |
          {
            echo "codeql_verdict=not-implemented"
            echo "scanner_status=codeql=not-implemented,gitleaks=not-implemented,osv-npm=not-implemented,trivy=not-implemented,zap=not-implemented,syft=not-implemented,zizmor=not-implemented"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### P5 scanners"
            echo "NOT IMPLEMENTED: CodeQL and every scanner in config/scan/implementation-status.json are stubs."
          } >> "$GITHUB_STEP_SUMMARY"

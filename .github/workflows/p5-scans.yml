name: p5-scans

on:
  workflow_call:
    outputs:
      codeql_verdict:
        description: "CodeQL verdict from the summary job; not-implemented until the codeql job lands"
        value: ${{ jobs.summary.outputs.codeql_verdict }}
      scanner_status:
        description: "name=verdict pairs, one per registry key, in registry order"
        value: ${{ jobs.summary.outputs.scanner_status }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide: # report-only policy (O-6)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      report: ${{ steps.decide.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/scan/decide-report.sh >> "$GITHUB_OUTPUT"

  gitleaks: # blocking, this repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install gitleaks
        run: bash scripts/scan/fetch-tool.sh gitleaks
      - id: range # PR and push-with-history only (section 5.2); tree-only otherwise
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/gitleaks"; mkdir -p "$out"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "gitleaks range: base is missing or malformed" >&2; exit 1; fi
          "$RUNNER_TEMP/tools/gitleaks" git . --config config/scan/gitleaks.toml --no-banner --redact \
            --log-opts="$BASE_SHA..$HEAD_SHA" -f json -r "$out/range.json" --exit-code 2
          code=$?
          echo "range_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "gitleaks range: tool error" >&2; exit 1; fi
      - id: scan # exit 2 = leaks (computed fail, step exits 0); 1 = tool error
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/gitleaks"; mkdir -p "$out"
          "$RUNNER_TEMP/tools/gitleaks" dir . --config config/scan/gitleaks.toml --no-banner --redact \
            -f json -r "$out/tree.json" --exit-code 2
          code=$?
          echo "gitleaks_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "gitleaks: tool error" >&2; exit 1; fi
      - id: verdict # exits 0 on a computed fail; fails the job only on bad input
        env:
          TREE_EXIT: ${{ steps.scan.outputs.gitleaks_exit }}
          RANGE_EXIT: ${{ steps.range.outputs.range_exit }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/gitleaks"
          args=("$out/tree.json" "$TREE_EXIT")
          if [ -n "$RANGE_EXIT" ]; then args+=("$out/range.json" "$RANGE_EXIT"); fi
          node --experimental-strip-types scripts/scan/gitleaks-threshold.ts "${args[@]}" >> "$GITHUB_OUTPUT"

  gitleaks-forks: # report-only: the pinned forks, tool errors only fail
    needs: [decide]
    if: needs.decide.outputs.report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install gitleaks
        run: bash scripts/scan/fetch-tool.sh gitleaks
      - name: Scan each pinned fork (report only)
        run: |
          set -uo pipefail
          tool="$RUNNER_TEMP/tools/gitleaks"
          products="$(node -e 'console.log(Object.keys(JSON.parse(require("node:fs").readFileSync("config/scan/forks.json", "utf8")).forks).join(" "))')"
          for product in $products; do
            dest="$RUNNER_TEMP/forks/$product"
            if ! bash scripts/scan/fork-source.sh "$product" "$dest"; then
              echo "gitleaks-forks: could not fetch $product at its pin" >&2; exit 1
            fi
            out="$RUNNER_TEMP/scan-out/forks"; mkdir -p "$out"
            "$tool" dir "$dest" --no-banner --redact -f json -r "$out/$product.json" --exit-code 2
            code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "gitleaks-forks: tool error on $product" >&2; exit 1; fi
          done

  summary: # the aggregator (section 5.9)
    needs: [decide, gitleaks, gitleaks-forks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      codeql_verdict: ${{ steps.agg.outputs.codeql_verdict }}
      scanner_status: ${{ steps.agg.outputs.scanner_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - id: agg
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/scan/aggregate.ts >> "$GITHUB_OUTPUT"

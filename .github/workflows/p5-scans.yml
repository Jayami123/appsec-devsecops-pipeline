name: p5-scans

on:
  workflow_call:
    outputs:
      codeql_verdict:
        description: "CodeQL verdict from the summary job; not-implemented until the codeql job lands"
        value: ${{ jobs.summary.outputs.codeql_verdict }}
      scanner_status:
        description: "name=verdict pairs, one per registry key, in registry order"
        value: ${{ jobs.summary.outputs.scanner_status }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide: # report-only policy (O-6)
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      report: ${{ steps.decide.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/scan/decide-report.sh >> "$GITHUB_OUTPUT"

  gitleaks: # blocking, this repository
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install gitleaks
        run: bash scripts/scan/fetch-tool.sh gitleaks
      - id: range # PR and push-with-history only (section 5.2); tree-only otherwise
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/gitleaks"; mkdir -p "$out"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "gitleaks range: base is missing or malformed" >&2; exit 1; fi
          code=0
          "$RUNNER_TEMP/tools/gitleaks" git . --config config/scan/gitleaks.toml --no-banner --redact \
            --log-opts="$BASE_SHA..$HEAD_SHA" -f json -r "$out/range.json" --exit-code 2 || code=$?
          echo "range_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "gitleaks range: tool error" >&2; exit 1; fi
      - id: scan # exit 2 = leaks (computed fail, step exits 0); 1 = tool error
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/gitleaks"; mkdir -p "$out"
          code=0
          "$RUNNER_TEMP/tools/gitleaks" dir . --config config/scan/gitleaks.toml --no-banner --redact \
            -f json -r "$out/tree.json" --exit-code 2 || code=$?
          echo "gitleaks_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "gitleaks: tool error" >&2; exit 1; fi
      - id: verdict # exits 0 on a computed fail; fails the job only on bad input
        env:
          TREE_EXIT: ${{ steps.scan.outputs.gitleaks_exit }}
          RANGE_EXIT: ${{ steps.range.outputs.range_exit }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/gitleaks"
          args=("$out/tree.json" "$TREE_EXIT")
          if [ -n "$RANGE_EXIT" ]; then args+=("$out/range.json" "$RANGE_EXIT"); fi
          node --experimental-strip-types scripts/scan/gitleaks-threshold.ts "${args[@]}" >> "$GITHUB_OUTPUT"

  gitleaks-forks: # report-only: the pinned forks, tool errors only fail
    needs: [decide]
    if: needs.decide.outputs.report == 'true'
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install gitleaks
        run: bash scripts/scan/fetch-tool.sh gitleaks
      - name: Scan each pinned fork (report only)
        run: |
          set -uo pipefail
          tool="$RUNNER_TEMP/tools/gitleaks"
          products="$(node -e 'console.log(Object.keys(JSON.parse(require("node:fs").readFileSync("config/scan/forks.json", "utf8")).forks).join(" "))')"
          for product in $products; do
            dest="$RUNNER_TEMP/forks/$product"
            if ! bash scripts/scan/fork-source.sh "$product" "$dest"; then
              echo "gitleaks-forks: could not fetch $product at its pin" >&2; exit 1
            fi
            out="$RUNNER_TEMP/scan-out/forks"; mkdir -p "$out"
            code=0
            "$tool" dir "$dest" --no-banner --redact -f json -r "$out/$product.json" --exit-code 2 || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "gitleaks-forks: tool error on $product" >&2; exit 1; fi
          done

  osv-npm: # blocking, the root package-lock.json (OSV primary; npm D5 cross-check)
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install osv-scanner
        run: bash scripts/scan/fetch-tool.sh osv-scanner
      - id: osv
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/osv"; mkdir -p "$out"
          code=0
          "$RUNNER_TEMP/tools/osv-scanner" scan source -L package-lock.json --format json > "$out/root.json" 2>"$out/root.err" || code=$?
          echo "osv_exit=$code" >> "$GITHUB_OUTPUT"
      - id: npm
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/npm"; mkdir -p "$out"
          npm audit --package-lock-only --json > "$out/audit.json" 2>"$out/audit.err" || true
      - id: verdict # fails only on unusable input; a computed fail is verdict=fail
        env:
          OSV_EXIT: ${{ steps.osv.outputs.osv_exit }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out"
          osv_v="$(node --experimental-strip-types scripts/scan/osv-threshold.ts "$out/osv/root.json" "$OSV_EXIT" config/scan/baseline/osv.json)" || { echo "osv threshold: unusable input" >&2; exit 1; }
          npm_v="$(node --experimental-strip-types scripts/scan/npm-threshold.ts "$out/npm/audit.json" config/scan/baseline/npm-audit.json)" || { echo "npm threshold: unusable input" >&2; exit 1; }
          if [ "$osv_v" = "verdict=pass" ] && [ "$npm_v" = "verdict=pass" ]; then echo "verdict=pass"; else echo "verdict=fail"; fi >> "$GITHUB_OUTPUT"

  osv-forks: # report-only: each pinned fork lockfile; tool errors fail
    needs: [decide]
    if: needs.decide.outputs.report == 'true'
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install osv-scanner
        run: bash scripts/scan/fetch-tool.sh osv-scanner
      - name: Scan each pinned fork lockfile (report only)
        run: |
          set -uo pipefail
          tool="$RUNNER_TEMP/tools/osv-scanner"
          products="$(node -e 'console.log(Object.keys(JSON.parse(require("node:fs").readFileSync("config/scan/forks.json", "utf8")).forks).join(" "))')"
          for product in $products; do
            dest="$RUNNER_TEMP/forks/$product"
            if ! bash scripts/scan/fork-source.sh "$product" "$dest"; then
              echo "osv-forks: could not fetch $product at its pin" >&2; exit 1
            fi
            if [ ! -f "$dest/package-lock.json" ]; then echo "osv-forks: $product has no package-lock.json"; continue; fi
            out="$RUNNER_TEMP/scan-out/osv-forks"; mkdir -p "$out"
            code=0
            (cd "$dest" && "$tool" scan source -L package-lock.json --format json) > "$out/$product.json" 2>"$out/$product.err" || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 1 ] && [ "$code" -ne 128 ]; then echo "osv-forks: tool error on $product ($code)" >&2; exit 1; fi
          done

  trivy: # blocking, the root filesystem (--include-dev-deps is required)
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install trivy
        run: bash scripts/scan/fetch-tool.sh trivy
      - id: scan
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/trivy"; mkdir -p "$out"
          code=0
          "$RUNNER_TEMP/tools/trivy" fs --include-dev-deps --scanners vuln --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --format json --quiet -o "$out/root.json" . || code=$?
          if [ "$code" -ne 0 ]; then echo "trivy: tool error ($code)" >&2; exit 1; fi
      - id: verdict
        run: node --experimental-strip-types scripts/scan/trivy-threshold.ts "$RUNNER_TEMP/scan-out/trivy/root.json" root config/scan/baseline/trivy.json >> "$GITHUB_OUTPUT"

  trivy-upload: # report SARIF; failure of the upload is fail, findings are not
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # the only job in p5-scans that uploads (section 5.1)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install trivy
        run: bash scripts/scan/fetch-tool.sh trivy
      - name: Build the SARIF report
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/trivy-sarif"; mkdir -p "$out"
          "$RUNNER_TEMP/tools/trivy" fs --include-dev-deps --scanners vuln --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --format sarif -o "$out/root.sarif" . || { echo "trivy sarif: tool error" >&2; exit 1; }
      - name: PN-7 artefact token scan (before the SARIF upload)
        run: node scripts/scan/evidence-token-scan.mjs "$RUNNER_TEMP/scan-out/trivy-sarif"
      - name: Upload the SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/scan-out/trivy-sarif/root.sarif
          category: trivy

  trivy-images: # report-only: JSON per pinned image digest, never SARIF
    needs: [decide]
    if: needs.decide.outputs.report == 'true'
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install trivy
        run: bash scripts/scan/fetch-tool.sh trivy
      - name: Scan each pinned image (report only)
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/images"; mkdir -p "$out"
          node -e 'const d=JSON.parse(require("node:fs").readFileSync("config/scan/images.json","utf8")); for (const i of d.images) console.log(i.name+" "+i.repo+"@"+i.digest)' | while read -r name ref; do
            code=0
            "$RUNNER_TEMP/tools/trivy" image --image-src remote --scanners vuln --cache-dir "$RUNNER_TEMP/trivy-cache" \
              --format json --quiet -o "$out/$name.json" "$ref" || code=$?
            if [ "$code" -ne 0 ]; then echo "trivy-images: tool error on $name ($code)" >&2; exit 1; fi
          done

  trivy-forks: # report-only: each pinned fork, JSON, tool errors fail
    needs: [decide]
    if: needs.decide.outputs.report == 'true'
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install trivy
        run: bash scripts/scan/fetch-tool.sh trivy
      - name: Scan each pinned fork (report only)
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/forks"; mkdir -p "$out"
          products="$(node -e 'console.log(Object.keys(JSON.parse(require("node:fs").readFileSync("config/scan/forks.json", "utf8")).forks).join(" "))')"
          for product in $products; do
            dest="$RUNNER_TEMP/forks/$product"
            if ! bash scripts/scan/fork-source.sh "$product" "$dest"; then
              echo "trivy-forks: could not fetch $product at its pin" >&2; exit 1
            fi
            code=0
            "$RUNNER_TEMP/tools/trivy" fs --scanners vuln --cache-dir "$RUNNER_TEMP/trivy-cache" \
              --format json --quiet -o "$out/$product.json" "$dest" || code=$?
            if [ "$code" -ne 0 ]; then echo "trivy-forks: tool error on $product ($code)" >&2; exit 1; fi
          done

  codeql: # calls codeql-reusable.yml; verdict is the reusable output
    needs: [decide]
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-reusable.yml

  zizmor: # blocking on error-level results; offline (--no-online-audits, O-9)
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install zizmor (pinned wheel, hash-checked)
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --require-hashes -r config/scan/zizmor-requirements.txt
      - id: audit
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/scan-out/zizmor"; mkdir -p "$out"
          code=0
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --no-online-audits --format sarif .github/workflows > "$out/zizmor.sarif" || code=$?
          echo "zizmor_exit=$code" >> "$GITHUB_OUTPUT"
      - id: verdict
        env:
          ZIZMOR_EXIT: ${{ steps.audit.outputs.zizmor_exit }}
        run: node --experimental-strip-types scripts/scan/zizmor-threshold.ts "$RUNNER_TEMP/scan-out/zizmor/zizmor.sarif" "$ZIZMOR_EXIT" >> "$GITHUB_OUTPUT"

  syft: # report-only SBOM per pinned image; skipped (policy) unless decide.report is true
    needs: [decide]
    if: needs.decide.outputs.report == 'true'
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.sbom.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Install syft
        run: bash scripts/scan/fetch-tool.sh syft
      - id: sbom
        env:
          SYFT_BIN: ${{ runner.temp }}/tools/syft
        run: bash scripts/scan/sbom.sh "$RUNNER_TEMP/scan-out/syft" >> "$GITHUB_OUTPUT"

  summary: # the aggregator (section 5.9)
    needs:
      [
        decide,
        gitleaks,
        gitleaks-forks,
        osv-npm,
        osv-forks,
        trivy,
        trivy-upload,
        trivy-images,
        trivy-forks,
        codeql,
        zizmor,
        syft,
      ]
    if: always()
    # Pinned: ubuntu-latest is ubuntu26.04, which Playwright 1.64 does not support for chromium (CI run 42974288439).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      codeql_verdict: ${{ steps.agg.outputs.codeql_verdict }}
      scanner_status: ${{ steps.agg.outputs.scanner_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - id: agg
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/scan/aggregate.ts >> "$GITHUB_OUTPUT"
